name: Validate GuitarPal

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Configure Android paths
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, shutil
          sdk = pathlib.Path(shutil.which('flutter')).resolve().parents[1]
          pathlib.Path('android/local.properties').write_text(
              f"sdk.dir={os.environ['ANDROID_HOME']}\nflutter.sdk={sdk}\n"
          )
          PYTHON
      - run: gradle -p android :app:testDebugUnitTest

  audio-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements-contracts.txt
      - run: python -m pip install -r server/requirements-contracts.txt
      - run: python -m unittest discover -s server/tests -v
        env:
          PYTHONPATH: server
      - run: python -m guitarpal_audio.check_contracts
        env:
          PYTHONPATH: server
